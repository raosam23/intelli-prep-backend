[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for IntelliPrep, an AI interview-prep app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.135.1",
    "langchain-openai>=1.1.11",
    "langgraph>=1.1.3",
    "pdfplumber>=0.11.9",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.48",
    "sqlmodel>=0.0.37",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.409",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
src = ["app", "tests"]
line-length = 120
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F821"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pyright]
include = ["app", "tests"]
exclude = ["alembic", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
